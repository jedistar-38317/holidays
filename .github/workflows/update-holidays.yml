   name: 공휴일 갱신

   on:
     schedule:
       - cron: "7 18 * * *"   # 매일 03:07 (한국시간)
     workflow_dispatch:

   permissions:
     contents: write

   jobs:
     update:
       runs-on: ubuntu-latest
       steps:
         - uses: actions/checkout@v4

         - uses: actions/setup-python@v5
           with:
             python-version: "3.12"

         - name: 천문연 API 조회
           env:
             KASI_KEY: ${{ secrets.KASI_KEY }}
           run: python scripts/fetch_holidays.py

         - name: 바뀐 내용 있으면 커밋
           if: always()
           run: |
             git config user.name  "github-actions[bot]"
             git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
             git add docs/*.json
             git diff --cached --quiet || git commit -m "공휴일 갱신 $(TZ=Asia/Seoul date +%F)"
             git push
